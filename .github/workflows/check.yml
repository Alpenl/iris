name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
env:
  IRIS_FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '200000' || '2000' }}
  IRIS_FUZZ_SEED: ${{ github.run_id }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  official-plugins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - name: Rebuild official Wasm plugins in pinned linux/amd64 container and verify byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/build-official-plugins.py --container --verify-embedded --output "$RUNNER_TEMP/official-plugins"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-official-plugins
          path: |
            ${{ runner.temp }}/official-plugins/index.json
            ${{ runner.temp }}/official-plugins/*.irisplugin
          if-no-files-found: error
          retention-days: 3
  macos:
    needs: official-plugins
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-official-plugins
          path: ${{ runner.temp }}/verified-official-plugins
      - name: Cache pinned Zig toolchain for plugin v2 CI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/v2-ci
          key: iris-zig-v2-ci-0.14.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/run-plugin-v2-ci.py') }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
          rustup target add wasm32-unknown-unknown
      # Homebrew's libmpv is a GPL build; it only runs the tests and is never shipped.
      - run: brew install mpv
      - run: python3 -B scripts/check-project.py
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --future-incompat-report
      - run: python3 -B scripts/run-plugin-v2-ci.py
        env:
          IRIS_VERIFIED_OFFICIAL_PLUGINS: ${{ runner.temp }}/verified-official-plugins
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --release -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features iris/devtools -- -D warnings
      - run: python3 -B scripts/check-project.py --future-incompat-report target/.future-incompat-report.json
  windows-media:
    uses: ./.github/workflows/media-sdk.yml
    with:
      target: windows-x86_64
      runner: ubuntu-24.04
      test_runtime_only: true
  windows:
    needs: [official-plugins, windows-media]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-official-plugins
          path: ${{ runner.temp }}/verified-official-plugins
      - name: Cache pinned Zig toolchain for plugin v2 CI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/v2-ci
          key: iris-zig-v2-ci-0.14.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/run-plugin-v2-ci.py') }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --component rust-src
          rustup default 1.100.0
          rustup target add wasm32-unknown-unknown
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media-sdk-windows-x86_64
          path: ${{ runner.temp }}
      - name: Load pinned Windows test runtime
        shell: pwsh
        run: |
          tar -C $env:RUNNER_TEMP -xzf "$env:RUNNER_TEMP/media-sdk.tar.gz"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MPV_LIB_DIR=$env:RUNNER_TEMP\media-sdk\prefix\lib" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP\media-sdk\prefix\bin" >> $env:GITHUB_PATH
      - run: python -B scripts/check-project.py
      - run: cargo test --locked --workspace --future-incompat-report
      - run: python -B scripts/run-plugin-v2-ci.py
        env:
          IRIS_VERIFIED_OFFICIAL_PLUGINS: ${{ runner.temp }}\verified-official-plugins
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --release -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features iris/devtools -- -D warnings
      - run: python -B scripts/check-project.py --future-incompat-report target/.future-incompat-report.json
