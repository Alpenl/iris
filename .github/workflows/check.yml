name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
      # Homebrew's libmpv is a GPL build; it only runs the tests and is never shipped.
      - run: brew install mpv
      - run: python3 scripts/check-project.py
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --future-incompat-report
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --release -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features iris/devtools -- -D warnings
      - run: python3 scripts/check-project.py --future-incompat-report target/.future-incompat-report.json
  windows-media:
    uses: ./.github/workflows/media-sdk.yml
    with:
      target: windows-x86_64
      runner: ubuntu-24.04
      test_runtime_only: true
  windows:
    needs: windows-media
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media-sdk-windows-x86_64
          path: ${{ runner.temp }}
      - name: Load pinned Windows test runtime
        shell: pwsh
        run: |
          tar -C $env:RUNNER_TEMP -xzf "$env:RUNNER_TEMP/media-sdk.tar.gz"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MPV_LIB_DIR=$env:RUNNER_TEMP\media-sdk\prefix\lib" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP\media-sdk\prefix\bin" >> $env:GITHUB_PATH
      - run: python scripts/check-project.py
      - run: cargo test --locked --workspace --future-incompat-report
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --release -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features iris/devtools -- -D warnings
      - run: python scripts/check-project.py --future-incompat-report target/.future-incompat-report.json
