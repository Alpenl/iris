name: Release recipe policy
on:
  pull_request:
    paths: ['scripts/release/**', '.github/workflows/release-*.yml', '.github/workflows/media-sdk.yml', 'LICENSE-*', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'deny.toml']
  push:
    paths: ['scripts/release/**', '.github/workflows/release-*.yml', '.github/workflows/media-sdk.yml', 'LICENSE-*', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'deny.toml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - name: Parse Python recipes and reject mutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib, runpy, json
          root = pathlib.Path('scripts/release')
          for path in root.glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          recipe = runpy.run_path(str(root / 'build-media.py'))
          recipe['validate_lock'](json.loads((root / 'sources.lock.json').read_text(encoding='utf-8')))
          assert pathlib.Path('LICENSE-MIT').is_file()
          assert pathlib.Path('LICENSE-APACHE').is_file()
          PY
      - name: Check Rust advisories, licenses, bans and sources
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          cargo install cargo-deny --version 0.22.0 --locked
          cargo deny --locked check advisories licenses bans sources
