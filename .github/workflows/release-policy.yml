name: Release recipe policy
on:
  pull_request:
    paths: ['scripts/release/**', '.github/workflows/release-*.yml', '.github/workflows/media-sdk.yml', 'LICENSE-*', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'deny.toml']
  push:
    paths: ['scripts/release/**', '.github/workflows/release-*.yml', '.github/workflows/media-sdk.yml', 'LICENSE-*', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'deny.toml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - name: Parse Python recipes and reject mutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, pathlib, re
          root = pathlib.Path('scripts/release')
          for path in root.glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          lock = json.loads((root / 'sources.lock.json').read_text())
          for name, source in lock['sources'].items():
              assert re.fullmatch('[a-f0-9]{40}', source['revision']), name
              assert re.fullmatch('[a-f0-9]{64}', source['sha256']), name
              assert source['url'].endswith('/' + source['revision']), name
              assert not re.search(r'(?<!L)GPL|nonfree', source['license'], re.I), name
          for key in ('windows_toolchain', 'linux_windows_toolchain'):
              assert re.fullmatch('[a-f0-9]{64}', lock[key]['sha256'])
          assert pathlib.Path('LICENSE-MIT').is_file()
          assert pathlib.Path('LICENSE-APACHE').is_file()
          PY
      - name: Enforce Rust license allowlist
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          cargo install cargo-deny --version 0.18.3 --locked
          cargo deny --locked check licenses bans sources
