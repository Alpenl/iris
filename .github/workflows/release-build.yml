name: Source-built LGPL distributions
on:
  workflow_dispatch:
    inputs:
      version:
        description: Authorized workspace version (0.0.x)
        required: true
        default: '0.0.2'
      mode:
        description: Local is unsigned; release requires signing and macOS notarization secrets
        type: choice
        options: [local, release]
        default: local
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    uses: ./.github/workflows/media-sdk.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
  compile:
    needs: media
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
            rust: x86_64-pc-windows-msvc
          - target: macos-arm64
            runner: macos-15
            rust: aarch64-apple-darwin
          - target: macos-x86_64
            runner: macos-15-intel
            rust: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      IRIS_PACKAGE_VERSION: ${{ inputs.version }}
      IRIS_PACKAGE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Rust toolchain and license gate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add '${{ matrix.rust }}' wasm32-unknown-unknown
          cargo install cargo-deny --version 0.22.0 --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/media-download
      - name: Extract media SDK
        shell: bash
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/media-download/media-sdk.tar.gz"
      - name: Compile Iris and collect release inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/package.py --sdk "$RUNNER_TEMP/media-sdk" --output "$RUNNER_TEMP/iris-dist" --version "$IRIS_PACKAGE_VERSION" --mode "$IRIS_PACKAGE_MODE" --prepare-only
          tar -C "$RUNNER_TEMP/iris-dist" -cf "$RUNNER_TEMP/iris-unsigned.tar" unsigned package-checkpoint.json media-runtime-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iris-unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/iris-unsigned.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  package:
    needs: [media, compile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      IRIS_PACKAGE_VERSION: ${{ inputs.version }}
      IRIS_PACKAGE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& scripts/release/install-inno.ps1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/media-download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: iris-unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/unsigned-download
      - name: Extract verified-build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iris-dist"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/media-download/media-sdk.tar.gz"
          tar -C "$RUNNER_TEMP/iris-dist" -xf "$RUNNER_TEMP/unsigned-download/iris-unsigned.tar"
      - name: Import Windows release certificate
        if: runner.os == 'Windows' && inputs.mode == 'release'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.IRIS_WINDOWS_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'IRIS_WINDOWS_PFX_BASE64 secret required' }
          $pfx = Join-Path $env:RUNNER_TEMP 'iris-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "IRIS_WINDOWS_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import macOS Developer ID and notarization credentials
        if: runner.os == 'macOS' && inputs.mode == 'release'
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.IRIS_MAC_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IRIS_MAC_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IRIS_MAC_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.IRIS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.IRIS_APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.IRIS_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${CERT_BASE64:?required}" "${CERT_PASSWORD:?required}" "${KEYCHAIN_PASSWORD:?required}" "${APPLE_ID:?required}" "${APPLE_PASSWORD:?required}" "${TEAM_ID:?required}"
          printf '%s' "$CERT_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/iris-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/iris-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/iris-signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$RUNNER_TEMP/iris-signing.keychain-db"
          keychains=("$RUNNER_TEMP/iris-signing.keychain-db")
          while IFS= read -r line; do
            line="${line#*\"}"
            line="${line%\"*}"
            if [[ -n "$line" ]]; then keychains+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/iris-signing.keychain-db"
          xcrun notarytool store-credentials iris-release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --keychain "$RUNNER_TEMP/iris-signing.keychain-db"
          echo IRIS_NOTARY_PROFILE=iris-release >> "$GITHUB_ENV"
          echo "IRIS_NOTARY_KEYCHAIN=$RUNNER_TEMP/iris-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Sign and package completed application build
        shell: bash
        env:
          IRIS_WINDOWS_PFX_PASSWORD: ${{ secrets.IRIS_WINDOWS_PFX_PASSWORD }}
          IRIS_TIMESTAMP_URL: ${{ secrets.IRIS_TIMESTAMP_URL }}
          IRIS_MAC_SIGN_IDENTITY: ${{ secrets.IRIS_MAC_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          python scripts/release/package.py --sdk "$RUNNER_TEMP/media-sdk" --output "$RUNNER_TEMP/iris-dist" --version "$IRIS_PACKAGE_VERSION" --mode "$IRIS_PACKAGE_MODE" --resume --package-only
      - name: Delete Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'iris-signing.pfx'
          if (Test-Path $file) { Remove-Item $file -Force }
      - name: Delete macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [[ -f "$RUNNER_TEMP/iris-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/iris-signing.keychain-db"; fi
      - name: Verify Windows Open With registration and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item "$env:RUNNER_TEMP/iris-dist/*-setup.exe"
          $params = @($installer.FullName)
          if ($env:IRIS_PACKAGE_MODE -eq "release") { $params += "--signed" }
          python scripts/check-windows-installer.py @params
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Iris-${{ inputs.version }}-${{ matrix.target }}-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/iris-dist/Iris-*.zip
            ${{ runner.temp }}/iris-dist/*.dmg
            ${{ runner.temp }}/iris-dist/*-setup.exe
            ${{ runner.temp }}/iris-dist/*.tar.gz
            ${{ runner.temp }}/iris-dist/*.build-manifest.json
            ${{ runner.temp }}/iris-dist/media-runtime-verification.json
            ${{ runner.temp }}/iris-dist/plugin-runtime-check.json
            ${{ runner.temp }}/iris-dist/notary-*-result.json
            ${{ runner.temp }}/iris-dist/notary-result.json
            ${{ runner.temp }}/iris-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Preserve notarization diagnostics on failure
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notary-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/iris-dist/notary-*-result.json
            ${{ runner.temp }}/iris-dist/notary-result.json
          if-no-files-found: warn
