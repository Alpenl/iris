name: Source-built LGPL distributions
on:
  workflow_dispatch:
    inputs:
      version:
        description: Authorized workspace version (0.0.x)
        required: true
        default: '0.0.1'
      mode:
        description: Local is unsigned; release requires signing and macOS notarization secrets
        type: choice
        options: [local, release]
        default: local
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    uses: ./.github/workflows/media-sdk.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
  package:
    needs: media
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
          - target: macos-arm64
            runner: macos-15
            rust: aarch64-apple-darwin
          - target: macos-x86_64
            runner: macos-15-intel
            rust: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      IRIS_WINDOWS_PFX_PASSWORD: ${{ secrets.IRIS_WINDOWS_PFX_PASSWORD }}
      IRIS_TIMESTAMP_URL: ${{ secrets.IRIS_TIMESTAMP_URL }}
      IRIS_MAC_SIGN_IDENTITY: ${{ secrets.IRIS_MAC_SIGN_IDENTITY }}
      IRIS_PACKAGE_VERSION: ${{ inputs.version }}
      IRIS_PACKAGE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Rust toolchain and license gate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add '${{ matrix.rust }}'
          cargo install cargo-deny --version 0.18.3 --locked
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts/release/install-inno.ps1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/media-download
      - name: Extract media SDK
        shell: bash
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/media-download/media-sdk.tar.gz"
      - name: Import Windows release certificate
        if: runner.os == 'Windows' && inputs.mode == 'release'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.IRIS_WINDOWS_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw 'IRIS_WINDOWS_PFX_BASE64 secret required' }
          $pfx = Join-Path $env:RUNNER_TEMP 'iris-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "IRIS_WINDOWS_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import macOS Developer ID and notarization credentials
        if: runner.os == 'macOS' && inputs.mode == 'release'
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.IRIS_MAC_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IRIS_MAC_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IRIS_MAC_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.IRIS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.IRIS_APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.IRIS_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${CERT_BASE64:?required}" "${CERT_PASSWORD:?required}" "${KEYCHAIN_PASSWORD:?required}" "${APPLE_ID:?required}" "${APPLE_PASSWORD:?required}" "${TEAM_ID:?required}"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/iris-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/iris-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/iris-signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/iris-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/iris-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/iris-signing.keychain-db"
          xcrun notarytool store-credentials iris-release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --keychain "$RUNNER_TEMP/iris-signing.keychain-db"
          echo IRIS_NOTARY_PROFILE=iris-release >> "$GITHUB_ENV"
      - name: Build and package application
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/package.py --sdk "$RUNNER_TEMP/media-sdk" --output "$RUNNER_TEMP/iris-dist" --version "$IRIS_PACKAGE_VERSION" --mode "$IRIS_PACKAGE_MODE"
      - name: Verify Windows Open With registration and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item "$env:RUNNER_TEMP/iris-dist/*-setup.exe"
          python scripts/check-windows-installer.py $installer.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Iris-${{ inputs.version }}-${{ matrix.target }}-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/iris-dist/*.zip
            ${{ runner.temp }}/iris-dist/*.dmg
            ${{ runner.temp }}/iris-dist/*-setup.exe
            ${{ runner.temp }}/iris-dist/*.tar.gz
            ${{ runner.temp }}/iris-dist/*.json
            ${{ runner.temp }}/iris-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Delete Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'iris-signing.pfx'
          if (Test-Path $file) { Remove-Item $file -Force }
      - name: Delete macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/iris-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/iris-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/signing.p12"
