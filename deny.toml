# cargo-deny policy for the Rust dependency tree.
#   cargo install cargo-deny && cargo deny --locked check advisories licenses bans sources
#
# Iris uses MIT OR Apache-2.0 (route B, see docs/DECISIONS.md), so every
# crate must be usable in permissive or closed-source builds. GPL / AGPL /
# LGPL-only crates are rejected because they are not listed here.
# MPL-2.0 is file-level copyleft and fine to link (dwrote, option-ext,
# cbindgen in the GPUI tree). libmpv / FFmpeg are C libraries outside cargo's
# view; their licence is handled by the LGPL build route, not by this file.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are unpublished; their MIT/Apache notices ship with the app.
ignore = true

[bans]
multiple-versions = "allow"
deny = [
    # GPUI's published builds generate native bindings; local crates are also checked directly.
    { name = "bindgen", wrappers = ["gpui", "gpui_media"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
