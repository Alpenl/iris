[workspace]
resolver = "2"
members = ["crates/iris-mpv", "crates/iris-api", "crates/iris-core", "crates/iris"]
default-members = ["crates/iris"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# objc 0.2's msg_send! expands to cfg(feature = "cargo-clippy").
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
rc_mutex = "deny"

[profile.dev]
debug = 0

[profile.release]
debug = "line-tables-only"
lto = "thin"
