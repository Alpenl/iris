[workspace]
resolver = "2"
members = ["crates/iris-mpv", "crates/iris-core", "crates/iris"]
default-members = ["crates/iris"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1"

[profile.dev]
debug = 0

[profile.release]
debug = "line-tables-only"
