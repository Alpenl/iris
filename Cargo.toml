[workspace]
resolver = "2"
members = ["crates/iris-mpv", "crates/iris-api", "crates/iris-base", "crates/iris-plugin-sdk", "crates/iris-plugin-guides", "crates/iris-plugin-webdav", "crates/iris-core", "crates/iris-plugin-host", "crates/iris-app", "crates/iris", "examples/plugins/watch-stats", "examples/plugins/virtual-audio", "examples/plugins/bilibili", "examples/plugins/baidupan"]
default-members = ["crates/iris"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
cocoa = "=0.26.0"
futures = "0.3"
gpui = { version = "=0.2.2", default-features = false }
httparse = "1.10"
image = { version = "0.25", default-features = false }
libc = "0.2"
log = "0.4"
miniz_oxide = "0.8"
mio = "1"
percent-encoding = "2.3"
ring = "0.17"
rustls = { version = "0.23", default-features = false }
serde = "1"
serde_json = "1"
tungstenite = { version = "=0.30.0", default-features = false }
url = "2"
wasmtime = { version = "=51.0.0", default-features = false }
windows = "0.61"
windows-sys = "0.61"
zip = { version = "=9.8.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# objc 0.2's msg_send! expands to cfg(feature = "cargo-clippy").
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
rc_mutex = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.dev]
debug = 0

[profile.release]
debug = "line-tables-only"
lto = "thin"
