[package]
name = "iris-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
aes = "0.8"
base64 = "0.22"
blake3 = "1"
cap-std = "4.0.3"
cbc = { version = "0.1", features = ["alloc"] }
futures = "0.3"
httpdate = "1"
httparse = "1.10"
iris-api = { path = "../iris-api" }
iris-base = { path = "../iris-base" }
iris-core = { path = "../iris-core" }
log = "0.4"
md-5 = "0.10"
miniz_oxide = "0.8"
mio = { version = "1", features = ["net", "os-poll"] }
percent-encoding = "2.3"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
url = "2"
wasmtime = { version = "=51.0.0", default-features = false, features = ["runtime", "cranelift", "pulley", "std"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
wat = "1"
