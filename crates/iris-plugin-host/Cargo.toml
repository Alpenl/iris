[package]
name = "iris-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
aes = "0.8"
base64.workspace = true
blake3 = "1"
cap-std = "4.0.3"
cbc = { version = "0.1", features = ["alloc"] }
futures.workspace = true
httpdate = "1"
httparse.workspace = true
iris-api = { path = "../iris-api" }
iris-base = { path = "../iris-base" }
iris-core = { path = "../iris-core" }
log.workspace = true
md-5 = "0.10"
miniz_oxide.workspace = true
mio = { workspace = true, features = ["net", "os-poll"] }
percent-encoding.workspace = true
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1 = "0.10"
url.workspace = true
wasmtime = { workspace = true, features = ["runtime", "cranelift", "pulley", "std"] }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tungstenite = { workspace = true, features = ["handshake"] }
wat = "1"
