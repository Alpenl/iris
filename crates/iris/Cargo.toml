[package]
name = "iris"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
devtools = ["iris-core/devtools"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
iris-mpv = { path = "../iris-mpv" }
iris-api = { path = "../iris-api" }
iris-core = { path = "../iris-core" }
futures = "0.3"
unicode-segmentation = "1.12"
url = "2"
raw-window-handle = "0.6"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "=0.26.0"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Power", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_ColorSystem", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop"] }

[lints]
workspace = true
