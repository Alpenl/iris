[package]
name = "iris-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Headless core: sessions, commands, state, geometry, metadata, VFS, presets, keymaps, and records.
# No GPUI and no native windowing API may be added here.

[features]
devtools = []

[dependencies]
anyhow.workspace = true
iris-mpv = { path = "../iris-mpv" }
iris-net = { path = "../iris-net" }
futures = "0.3"
miniz_oxide = "0.8"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2.3"
base64 = "0.22"
mio = { version = "1", features = ["net", "os-poll"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
