[package]
name = "iris-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Headless core: sessions, commands, state, geometry, metadata, VFS, presets, keymaps, and records.
# No GPUI and no native windowing API may be added here.

[features]
devtools = []

[dependencies]
anyhow.workspace = true
iris-mpv = { path = "../iris-mpv" }
iris-base = { path = "../iris-base" }
futures.workspace = true
miniz_oxide.workspace = true
log.workspace = true
env_logger = "0.11"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
percent-encoding.workspace = true
base64.workspace = true
mio = { workspace = true, features = ["net", "os-poll"] }
ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
