[package]
name = "iris-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Headless core: sessions, commands, state, geometry, metadata, VFS, presets, keymaps, and records.
# No GPUI and no native windowing API may be added here.

[features]
devtools = []

[dependencies]
anyhow.workspace = true
iris-mpv = { path = "../iris-mpv" }
iris-api = { path = "../iris-api" }
wasmtime = { version = "=51.0.0", default-features = false, features = ["runtime", "cranelift", "pulley", "std"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cap-std = "4.0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = "0.10"
blake3 = "1"
futures = "0.3"
miniz_oxide = "0.8"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2.3"
base64 = "0.22"
httparse = "1.10"
httpdate = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
mio = { version = "1", features = ["net", "os-poll"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
wat = "1"
