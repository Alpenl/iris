[package]
name = "iris-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Control-plane and vector-overlay plugin protocol for Iris.
# Strictly headless: no GPUI, no libmpv, and no pixel-data APIs.

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
